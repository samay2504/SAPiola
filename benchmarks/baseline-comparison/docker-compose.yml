version: '3'

services:
  memgraph:
    image: memgraph/memgraph
    ports:
      - "7687:7687"
    environment:
      - MEMGRAPH_TELEMETRY_ENABLED=false

  neo4j:
    image: neo4j:latest
    ports:
      - "7688:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
