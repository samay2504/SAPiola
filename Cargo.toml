[workspace]
members = [
    "sap-streaming-gateway",
    "sap-graph-layer",
    "poly-lsm-core",
    "sap-analytics-core", "sap-mcp-server",
]
resolver = "2"

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
