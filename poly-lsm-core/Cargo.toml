[package]
name = "poly-lsm-core"
version = "0.1.0"
edition = "2021"

[dependencies]
fjall = { version = "3", default-features = false, features = ["metrics"] }
lsm-tree = { version = "3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.5"
vers-vecs = { version = "1.0", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
dashmap = "6.2.1"
scopeguard = "1.2.0"
tracing = "0.1"

[dev-dependencies]
rand = "0.8"
criterion = "0.5"
proptest = "1.0"
[[bench]]
name = "write_throughput"
path = "benches/write_throughput.rs"
harness = false

[[bench]]
name = "adversarial_hub"
path = "benches/adversarial_hub.rs"
harness = false

[[test]]
name = "crash_recovery"
path = "tests/crash_recovery.rs"
harness = false

[[test]]
name = "crash_recovery_fold"
path = "tests/crash_recovery_fold.rs"
harness = false
